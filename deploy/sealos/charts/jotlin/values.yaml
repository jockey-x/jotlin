replicaCount: 1

image:
  repository: ghcr.io/jockey-x/jotlin
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

secret:
  create: true
  name: ""
  existingSecret: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: jotlin.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http

readinessProbe:
  httpGet:
    path: /
    port: http

nodeSelector: {}

tolerations: []

affinity: {}

env:
  NODE_ENV: production
  PORT: "3000"
  NEXT_PUBLIC_BASE_URL: "https://jotlin.example.com"
  OPENAI_API_BASE_URL: "https://api.openai.com/v1"
  S3_ENDPOINT: ""
  S3_PUBLIC_URL: ""
  S3_BUCKET_NAME: ""

secretEnv:
  DATABASE_URL: ""
  OPENAI_API_KEY: ""
  TAVILY_API_KEY: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  JWT_SECRET: ""
  SEALOS_JWT_SECRET: ""
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""

migrationJob:
  enabled: false
  backoffLimit: 1
  annotations: {}
  podAnnotations: {}
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  command:
    - sh
    - -c
    - npx prisma migrate deploy
